# Generated by Noctalia

# Status bar
set -g status-style "fg=#859289"

# Pane borders
set -g pane-border-style "fg=#e67e80"
set -g pane-active-border-style "fg=#a7c080"

# Window list formatting - number on accent, name on surface
set -g window-status-format "#[fg=#232a2e,bg=#d3c6aa] #I #[fg=#859289,bg=#232a2e] #W "

set -g window-status-current-format "#[fg=#232a2e,bg=#a7c080,bold] #I #[fg=#a7c080,bg=#232a2e,bold] #W "

# Messages & popups
set -g message-style "bg=#232a2e,fg=#a7c080"
set -g popup-style "bg=#232a2e,fg=#859289"
set -g popup-border-style "fg=#a7c080"

# Status bar content
set -g status-left-length 50
set -g status-right-length 50

set -g status-left "#[fg=#9da9a0,bold]#{session_name} #[fg=#d3c6aa]» "

set -g status-right '#[fg=#d3c6aa]| #[fg=#a7c080]#(whoami)@#H #[fg=#d3c6aa]| #(~/.config/tmux/scripts/cpu_status.sh) #[fg=#d3c6aa]| #(~/.config/tmux/scripts/ram_status.sh) #[fg=#d3c6aa]|#[fg=#859289] %H:%M'
