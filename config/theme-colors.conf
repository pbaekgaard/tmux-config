# Auto-generated from Omarchy theme: rose-pine-dark
# DO NOT EDIT - Changes will be overwritten on theme switch

# Status bar
set -g status-style "bg=#191724,fg=#e0def4"

# Pane borders
set -g pane-border-style "fg=#eb6f92"
set -g pane-active-border-style "fg=#31748f"

# Window list formatting - number on accent, name on surface
set -g window-status-format "#[fg=#191724,bg=#eb6f92] #I #[fg=#e0def4,bg=#191724] #W "
set -g window-status-current-format "#[fg=#191724,bg=#31748f,bold] #I #[fg=#31748f,bg=#191724,bold] #W "

# Messages & popups
set -g message-style "bg=#191724,fg=#31748f"
set -g popup-style "bg=#191724,fg=#e0def4"
set -g popup-border-style "fg=#31748f"

# Status bar content using theme colors
set -g status-left-length 50  # or any number that fits your session names
set -g status-right-length 50  # or any number that fits your session names
set -g status-left "#[fg=#ebbcba,bold]#{session_name} #[fg=#9ccfd8]» "
set -g status-right '#[fg=#9ccfd8]| #[fg=#f6c177]#(whoami)@#H #[fg=#9ccfd8]| #(~/.config/tmux/scripts/cpu_status.sh) #[fg=#9ccfd8]| #(~/.config/tmux/scripts/ram_status.sh) #[fg=#9ccfd8]|#[fg=#e0def4] %H:%M'
